[project]
name = "mercado-pago-payment-api"
version = "1.0.0"
description = "FastAPI-based Mercado Pago payment integration API with checkout and webhook support."
readme = "README.md"
requires-python = ">=3.10"

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'python -m uvicorn app:app --reload --host 0.0.0.0 --port 8000'
docs = 'mkdocs serve -a 127.0.0.1:8001'
docs_build = 'mkdocs build --clean'
docs_strict = 'mkdocs build --strict --clean'
docs_deploy = 'mkdocs gh-deploy --clean'
